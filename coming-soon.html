<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon — BrewHaven Café</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0d0a08;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Particle canvas bg */
    canvas { position: fixed; inset: 0; z-index: 0; }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .cup-mini {
      width: 80px;
      margin: 0 auto 2rem;
      animation: floatBig 3s ease-in-out infinite;
    }
    .cup-mini svg { width: 100%; height: auto; }

    @keyframes floatBig {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      color: #f5e6c8;
      letter-spacing: -1px;
      line-height: 1.1;
    }
    h1 span { color: #c8874a; }

    p {
      margin-top: 1.2rem;
      font-size: 1.1rem;
      color: rgba(245,230,200,.6);
      font-weight: 300;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .back-btn {
      display: inline-block;
      margin-top: 2.5rem;
      padding: .85rem 2.2rem;
      border: 1.5px solid rgba(200,135,74,.6);
      border-radius: 50px;
      color: #c8874a;
      text-decoration: none;
      font-size: .95rem;
      letter-spacing: .06em;
      transition: all .3s;
    }
    .back-btn:hover {
      background: rgba(200,135,74,.15);
      border-color: #c8874a;
      color: #f5e6c8;
    }

    .steam-line {
      display: inline-block;
      width: 2px;
      height: 30px;
      background: linear-gradient(to top, rgba(200,135,74,.6), transparent);
      border-radius: 2px;
      margin: 0 6px;
      animation: steamRise 2s ease-in-out infinite;
    }
    .steam-line:nth-child(2) { animation-delay: .4s; height: 22px; }
    .steam-line:nth-child(3) { animation-delay: .8s; height: 26px; }
    .steam-wrap { display: flex; justify-content: center; margin-bottom: .5rem; }

    @keyframes steamRise {
      0%   { opacity: 0; transform: translateY(0) scaleX(1); }
      40%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px) scaleX(1.4); }
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="content">
    <div class="cup-mini">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="42" width="60" height="44" rx="10" fill="#3a2010" stroke="#c8874a" stroke-width="2"/>
        <rect x="20" y="38" width="60" height="10" rx="4" fill="#c8874a" opacity=".9"/>
        <path d="M80 52 Q96 52 96 62 Q96 72 80 72" stroke="#c8874a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="50" cy="43" rx="30" ry="5" fill="#6b3a1f" opacity=".8"/>
        <!-- coffee liquid -->
        <rect x="22" y="50" width="56" height="32" rx="8" fill="#2a1508" opacity=".7"/>
        <ellipse cx="50" cy="50" rx="28" ry="4" fill="#5c2d0e" opacity=".9"/>
      </svg>
    </div>

    <div class="steam-wrap">
      <span class="steam-line"></span>
      <span class="steam-line"></span>
      <span class="steam-line"></span>
    </div>

    <h1>Coming<br/><span>Soon</span></h1>
    <p>We're brewing something special. This feature will be ready shortly — stay tuned!</p>

    <a href="index.html" class="back-btn">← Back to Café</a>
  </div>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x  = Math.random() * W;
        this.y  = Math.random() * H;
        this.r  = Math.random() * 1.5 + .3;
        this.vy = -(Math.random() * .4 + .1);
        this.vx = (Math.random() - .5) * .2;
        this.life = 0;
        this.maxLife = Math.random() * 200 + 100;
        this.alpha = 0;
      }
      update() {
        this.life++;
        this.x += this.vx;
        this.y += this.vy;
        const t = this.life / this.maxLife;
        this.alpha = t < .2 ? t / .2 : t > .8 ? (1 - t) / .2 : 1;
        if (this.life >= this.maxLife) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,135,74,${this.alpha * .35})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < 80; i++) particles.push(new Particle());

    function loop() {
      ctx.clearRect(0, 0, W, H);
      // subtle radial glow
      const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * .6);
      g.addColorStop(0, 'rgba(100,50,10,.15)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
